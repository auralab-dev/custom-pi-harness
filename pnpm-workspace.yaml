packages:
  - pi-web-access
  - pi-zvec-content
  - pi-document-convert

allowBuilds:
  '@google/genai': false
  protobufjs: false

  '@zvec/zvec': true
  onnxruntime-node: true
  sharp: true
  paperclip-mcp-server@https://codeload.github.com/auralab-dev/paperclip-mcp/tar.gz/89510c92ae1dde76e305a2327b32c09f8e487ddc: true

  # Optional dependency of zvec-grep; not needed for
  # local Model2Vec embeddings (including potion-multilingual-128m).
  node-llama-cpp: false
