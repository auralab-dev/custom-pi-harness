packages:
  - pi-web-access-main
  - pi-zvec-content
  - pi-document-convert

allowBuilds:
  '@google/genai': false
  protobufjs: false

  '@zvec/zvec': true
  onnxruntime-node: true
  sharp: true

  # Optional dependency of zvec-grep; not needed for
  # local Model2Vec embeddings (including potion-multilingual-128m).
  node-llama-cpp: false